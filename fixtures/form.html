<!doctype html><html lang="en"><head><title>Join the makers residency</title><style>body{font:15px/1.6 system-ui;background:#f7f6fa;color:#302d3c;max-width:680px;margin:45px auto;padding:35px;background:#fff}html{background:#f7f6fa}h1{font-size:30px;letter-spacing:-1px}label{display:block;margin:20px 0}input,textarea,select{display:block;width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #dad5e5;border-radius:6px;margin-top:6px}button{background:#7660c8;color:white;border:0;border-radius:6px;padding:12px 24px}small{color:#888}</style></head><body><small>NORTHSTAR COLLECTIVE / RESIDENCY APPLICATION</small><h1>A little about you.</h1><p>Tell us who you are and what you love to build.</p><form><label>Full name<input name="name" autocomplete="name"></label><label>Email address<input type="email" name="email"></label><label>Location<select name="location"><option value="">Choose your location</option><option value="london">London</option><option value="paris">Paris</option></select></label><label>About you<textarea name="bio" rows="3"></textarea></label><label>Company<input name="company" value="Keep my existing company"></label><label>Password<input name="password" type="password"></label><input type="hidden" name="hidden" value="hidden secret"><label style="display:none">Invisible<input name="invisible"></label><button type="submit">Submit application</button></form><script>window.submissions=0;document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();window.submissions++})</script></body></html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jev Form Filler</title><link rel="stylesheet" href="popup.css"><link rel="icon" type="image/png" href="icons/icon-32.png">
</head>
<body>
<header><div><strong>Jev Form Filler</strong><p id="page">Your current form</p></div><button id="manage" class="secondary">Manage profile</button></header>
<main><p id="status" role="status" aria-live="polite">Finding your form…</p><div id="answers"></div></main>
<footer><button id="fill" hidden>Fill selected</button><button id="undo" class="secondary" hidden>Undo fill</button><button id="scan" class="secondary" hidden>Scan again</button><small>Review answers before filling. Forms are never submitted.</small></footer>
<script type="module" src="popup.js"></script>
</body></html>

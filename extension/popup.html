<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jev Form Filler</title><link rel="stylesheet" href="popup.css"><link rel="icon" type="image/png" href="icons/icon-32.png">
</head>
<body>
<header><div><strong>Jev Form Filler</strong><p id="page">Your current form</p></div><button id="manage" class="secondary">Manage profile</button></header>
<main><p id="status" role="status" aria-live="polite">Fill saved details into the current form.</p><div id="file-choices"></div></main>
<footer><button id="import-profile" class="secondary" hidden>Import this profile</button><button id="fill">Fill Details</button><button id="undo" class="secondary" hidden>Undo fill</button><small>Existing values are kept. Files may upload when attached. Forms are never submitted.</small></footer>
<script type="module" src="popup.js"></script>
</body></html>
